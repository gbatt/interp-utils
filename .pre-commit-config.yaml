repos:
  - repo: local
    hooks:
      # Run the linter.
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types: [python]
      # Run the formatter.
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check
        language: system
        types: [python]
      # Run the type checker.
      - id: ty-check
        name: ty check
        entry: uv run ty check
        language: system
        types: [python]
      # Run pip-audit
      - id: pip-audit
        name: pip-audit
        entry: uv run pip-audit
        language: system
        always_run: true
        pass_filenames: false
