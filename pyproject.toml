[project]
name = "interp-utils"
version = "0.1.0"
description = "Utils for LLM experimentation"
readme = "README.md"
authors = [
    { name = "Nikhil Raghu", email = "nikhil.1990@gmail.com" }
]
requires-python = ">=3.13.3,<3.14"

dependencies = [
    "asyncer>=0.0.8",
    "httpx>=0.28.1",
    "openai>=2.9.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.6.3",
    "pip-audit>=2.10.0",
    "prek>=0.3.8",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.8",
    "ty>=0.0.26",
]

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
exclude-newer = "6 days"

[tool.ruff]
line-length = 80

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 40

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
